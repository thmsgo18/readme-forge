name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Keep this name: branch protection requires a check called "CI".
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check whitespace errors and conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Scripts parse
        run: |
          python3 -m py_compile scripts/*.py
          node --check scripts/capture_web.cjs
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Project detection runs
        run: python3 scripts/detect_project.py . --no-github > /dev/null

      - name: This README follows the readme-forge rules
        run: python3 scripts/lint_readme.py .
